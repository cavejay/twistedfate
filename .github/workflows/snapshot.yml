name: Refresh Piltover Archive snapshot

on:
  schedule:
    # Weekly, Monday 03:00 UTC — well clear of any deploy schedule.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run snapshot
        run: npm run snapshot

      - name: Validate snapshot output
        run: npm run snapshot:validate

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/legends.json public/data/decks.json; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/legends.json public/data/decks.json
          git commit -m "Refresh Piltover Archive snapshot"
          git push
