<!--
  Decorative base layer for the domain dial. Composited underneath the six
  coloured wedges drawn by DomainDial.tsx, so only the content inside
  roughly r<145 (and any flourish beyond r=190) stays visible once the
  wedge ring is layered on top. Replace this file with any 400x400
  viewBox SVG to reskin the dial artwork without touching component code.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="faceCore" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a1a4a" />
      <stop offset="70%" stop-color="#170f2c" />
      <stop offset="100%" stop-color="#0f0a1f" />
    </radialGradient>
    <radialGradient id="faceVignette" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
  </defs>

  <!-- outer flourish ring, peeks past the wedge ring's outer edge -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="#c9a44c" stroke-width="1" opacity="0.35" />
  <circle cx="200" cy="200" r="192" fill="none" stroke="#c9a44c" stroke-width="0.5" opacity="0.25" />

  <!-- center disc -->
  <circle cx="200" cy="200" r="144" fill="url(#faceCore)" />
  <circle cx="200" cy="200" r="144" fill="url(#faceVignette)" />
  <circle cx="200" cy="200" r="144" fill="none" stroke="#c9a44c" stroke-width="1.5" opacity="0.6" />

  <!-- 24 rune-style ticks around the inner boundary -->
  <g stroke="#c9a44c" stroke-linecap="round">
    <g id="tickLong">
      <line x1="200" y1="60" x2="200" y2="76" stroke-width="2" opacity="0.7" />
    </g>
    <g id="tickShort">
      <line x1="200" y1="60" x2="200" y2="70" stroke-width="1" opacity="0.4" />
    </g>
    <use href="#tickLong" transform="rotate(0 200 200)" />
    <use href="#tickShort" transform="rotate(15 200 200)" />
    <use href="#tickShort" transform="rotate(30 200 200)" />
    <use href="#tickLong" transform="rotate(45 200 200)" />
    <use href="#tickShort" transform="rotate(60 200 200)" />
    <use href="#tickShort" transform="rotate(75 200 200)" />
    <use href="#tickLong" transform="rotate(90 200 200)" />
    <use href="#tickShort" transform="rotate(105 200 200)" />
    <use href="#tickShort" transform="rotate(120 200 200)" />
    <use href="#tickLong" transform="rotate(135 200 200)" />
    <use href="#tickShort" transform="rotate(150 200 200)" />
    <use href="#tickShort" transform="rotate(165 200 200)" />
    <use href="#tickLong" transform="rotate(180 200 200)" />
    <use href="#tickShort" transform="rotate(195 200 200)" />
    <use href="#tickShort" transform="rotate(210 200 200)" />
    <use href="#tickLong" transform="rotate(225 200 200)" />
    <use href="#tickShort" transform="rotate(240 200 200)" />
    <use href="#tickShort" transform="rotate(255 200 200)" />
    <use href="#tickLong" transform="rotate(270 200 200)" />
    <use href="#tickShort" transform="rotate(285 200 200)" />
    <use href="#tickShort" transform="rotate(300 200 200)" />
    <use href="#tickLong" transform="rotate(315 200 200)" />
    <use href="#tickShort" transform="rotate(330 200 200)" />
    <use href="#tickShort" transform="rotate(345 200 200)" />
  </g>

  <!-- abstract 8-point filigree star at the center -->
  <g stroke="#c9a44c" fill="none" opacity="0.55">
    <g id="starSpoke">
      <path d="M200,200 L200,150 M200,150 L192,164 M200,150 L208,164" stroke-width="1.25" stroke-linecap="round" />
    </g>
    <use href="#starSpoke" transform="rotate(0 200 200)" />
    <use href="#starSpoke" transform="rotate(45 200 200)" />
    <use href="#starSpoke" transform="rotate(90 200 200)" />
    <use href="#starSpoke" transform="rotate(135 200 200)" />
    <use href="#starSpoke" transform="rotate(180 200 200)" />
    <use href="#starSpoke" transform="rotate(225 200 200)" />
    <use href="#starSpoke" transform="rotate(270 200 200)" />
    <use href="#starSpoke" transform="rotate(315 200 200)" />
  </g>

  <circle cx="200" cy="200" r="8" fill="#c9a44c" opacity="0.25" />
</svg>
